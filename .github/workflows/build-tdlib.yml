name: Build TDLib for Android

on:
  workflow_dispatch:

jobs:
  build:
    name: Build TDLib Java/JNI
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout official TDLib source
        uses: actions/checkout@v4
        with:
          repository: tdlib/td
          ref: master
          path: td

      - name: Show Docker version
        run: |
          docker version
          docker buildx version

      - name: Build TDLib for Android
        working-directory: td/example/android
        run: |
          mkdir -p "$GITHUB_WORKSPACE/output"
          docker build             --progress=plain             --build-arg TDLIB_INTERFACE=Java             --output "type=local,dest=$GITHUB_WORKSPACE/output"             .

      - name: Verify build output
        run: |
          echo "Generated files:"
          find "$GITHUB_WORKSPACE/output" -maxdepth 5 -type f -print
          test -n "$(find "$GITHUB_WORKSPACE/output" -type f -name 'tdlib*.zip' -print -quit)"

      - name: Upload TDLib package
        uses: actions/upload-artifact@v4
        with:
          name: tdlib-android-java
          path: output
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
