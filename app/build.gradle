plugins { id 'com.android.application' }
android {
    namespace 'com.alsala.alalamiya.screensaver'
    compileSdk 35
    defaultConfig {
        applicationId 'com.alsala.alalamiya.screensaver'
        minSdk 23
        targetSdk 29
        versionCode 1
        versionName '1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes { release { minifyEnabled false } }
}
